pipeline:
  version: "0.1.0"
  storage_mode: "nas"
  input_dir: '\\10.12.96.55\Development\NAB_Development\Talal\input'
  output_root: '\\10.12.96.55\Development\NAB_Development\Talal\New folder\Final_Test'
  allowed_file_types:
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".webp"
    - ".tif"
    - ".tiff"
    - ".pdf"
  process_mode: "per_page"
  skip_completed: true
  force_reprocess: false
  dry_run: false
  concurrency: 1
  prompt_version: "ocr_v1"
  pdf_render_scale: 2.0

nas:
  input_root: '\\10.12.96.55\Development\NAB_Development\Talal\input'
  output_root: '\\10.12.96.55\Development\NAB_Development\Talal\New folder\Final_Test'
  scratch_root: '.\temp\nas_scratch'
  share_label:
  publish_strategy: "local_scratch_create_only" # local_scratch_create_only, local_scratch_atomic
  healthcheck:
    enabled: true
    timeout_seconds: 10
    require_writable_output: false
  retry:
    attempts: 3
    backoff_seconds: 2.0
    max_backoff_seconds: 30.0
  locks:
    enabled: false
    stale_after_minutes: 240
    heartbeat_seconds: 60
  timeouts:
    read_seconds: 120
    write_seconds: 120
    publish_seconds: 300
  input_readiness:
    enabled: true
    stable_check_seconds: 5
    require_ready_marker: false
    ready_marker_suffix: ".ready"
  scratch:
    cleanup_on_success: true
    keep_failed_runs_days: 14
    keep_completed_runs_days: 3
  checksums:
    verify_after_copy: true
    verify_after_publish: true

provider:
  name: "gemini"
  model_name: "gemini-3-flash-preview"
  timeout_seconds: 90
  retry_limit: 3
  retry_backoff_seconds: 5.0
  retry_max_backoff_seconds: 60.0
  rate_limit_per_minute: 15
  rate_limit_max_retries: 4
  rate_limit_wait_budget_seconds: 300
  api_base_url: "https://generativelanguage.googleapis.com/v1beta"

review:
  correction_format: "yaml"
  report_title: "NCAI OCR Review"

export:
  instruction: "Extract the document faithfully in original Urdu script and return structured JSON."
  split_ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  target_format: "gemma_multimodal_jsonl"
  dataset_types:
    - "page_text"    # handwritten, regions, full, page_text
  output_formats:
    - "jsonl"   # jsonl, csv, json
  region_source: "blocks"   # blocks, sections
  assets:
    page_strategy: "shared_copy"
  handwritten:
    auto_detect: true
    keywords:
      - "handwritten"
      - "handwriting"
      - "hand-written"
      - "written by hand"
      - "manuscript"
      - "دستی"
      - "دستخط"
      - "تحریر"
    crop_padding: 24

logging:
  level: "INFO"
  structured: true
